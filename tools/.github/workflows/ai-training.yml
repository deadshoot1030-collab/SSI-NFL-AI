
name: SSI AI Training

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    paths:
      - 'tools/backtest_nfl.py'
      - '.github/workflows/ai-training.yml'

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Train and test AI
        run: python tools/backtest_nfl.py

      - name: Save training results
        uses: actions/upload-artifact@v4
        with:
          name: SSI-AI-results
          path: results.json
